# 部署到 GitHub Pages ＋ 每週自動更新場站資料
# - push 到 main：只部署
# - 每週一 05:00（台北時間）排程：先跑爬蟲更新資料、commit，再部署
name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 21 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scrape sources（每支最多重試 3 次，緩解外部網站瞬斷）
        run: |
          source scripts/ci-retry.sh
          retry node scripts/scrape-utg.mjs
          retry node scripts/scrape-carmochi.mjs
          retry node scripts/scrape-dodohome.mjs
          retry node scripts/scrape-24tps.mjs
          retry node scripts/scrape-vivipark.mjs
          retry node scripts/scrape-parkinsys.mjs
      - name: Geocode (incremental, cached)
        run: |
          source scripts/ci-retry.sh
          retry node scripts/geocode-carmochi.mjs
          retry node scripts/geocode-fallback.mjs
          retry node scripts/geocode-24tps.mjs
          retry node scripts/geocode-parkinsys.mjs
      - name: Refresh Autopass address overrides（補缺地址／座標；來源異常時保留舊檔）
        run: node scripts/scrape-autopass.mjs
      - name: Build dataset
        run: node scripts/build-dataset.mjs
      - name: Validate dataset（未通過即中止，網站保持舊資料）
        run: node scripts/validate-dataset.mjs
      - name: Write update log（給人看的每週更新報告；對比 HEAD 舊資料，須在 commit 前）
        run: node scripts/write-update-log.mjs
      - name: Copy to web
        run: cp data/parking-lots.json web/data/
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data web/data docs
          git diff --cached --quiet || git commit -m "chore: weekly data update"
          git push

  # 每週資料更新失敗時寄信通知（需在 repo Secrets 設定 MAIL_USERNAME／MAIL_PASSWORD，見 deploy.yml 註解）
  notify-failure:
    needs: [update-data]
    if: always() && needs.update-data.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Email on failure
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: 小P帶路 CI <${{ secrets.MAIL_USERNAME }}>
          to: angela.tzh@gmail.com
          subject: "⚠️ 小P帶路 每週資料更新失敗"
          body: |
            每週自動資料更新（update-data）執行失敗，網站維持舊資料、未產生更新報告。
            爬蟲已各自重試 3 次仍失敗，可能是來源網站改版或持續性問題，需要人工查看。

            失敗詳情（點進去看是哪一步）：
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  deploy:
    needs: [update-data]
    if: always() && (needs.update-data.result == 'success' || needs.update-data.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
