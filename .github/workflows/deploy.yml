# 部署到 GitHub Pages ＋ 每週自動更新場站資料
# - push 到 main：只部署
# - 每週一 05:00（台北時間）排程：先跑爬蟲更新資料、commit，再部署
name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 21 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scrape sources
        run: |
          node scripts/scrape-utg.mjs
          node scripts/scrape-carmochi.mjs
          node scripts/scrape-dodohome.mjs
          node scripts/scrape-24tps.mjs
          node scripts/scrape-vivipark.mjs
          node scripts/scrape-parkinsys.mjs
      - name: Geocode (incremental, cached)
        run: |
          node scripts/geocode-carmochi.mjs
          node scripts/geocode-fallback.mjs
          node scripts/geocode-24tps.mjs
          node scripts/geocode-parkinsys.mjs
      - name: Refresh Autopass address overrides（補缺地址／座標；來源異常時保留舊檔）
        run: node scripts/scrape-autopass.mjs
      - name: Build dataset
        run: node scripts/build-dataset.mjs
      - name: Validate dataset（未通過即中止，網站保持舊資料）
        run: node scripts/validate-dataset.mjs
      - name: Write update log（給人看的每週更新報告；對比 HEAD 舊資料，須在 commit 前）
        run: node scripts/write-update-log.mjs
      - name: Copy to web
        run: cp data/parking-lots.json web/data/
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data web/data docs
          git diff --cached --quiet || git commit -m "chore: weekly data update"
          git push

  deploy:
    needs: [update-data]
    if: always() && (needs.update-data.result == 'success' || needs.update-data.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
